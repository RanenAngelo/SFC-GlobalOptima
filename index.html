<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DineIQ Analytics — Restaurant Intelligence Command Center" />
    <title>DineIQ · Restaurant Intelligence</title>
    <script>
      // Apply theme before first paint to avoid flash.
      (function () {
        try {
          var pref = localStorage.getItem('dineiq.theme') || 'dark';
          var theme = pref === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : pref;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #07090f; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f4f6fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
